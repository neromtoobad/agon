name: python-test
on:
  push:
    paths: ["python/**", ".github/workflows/python-test.yml"]
  pull_request:
    paths: ["python/**"]
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches contract or RPC changes on mainnet
  workflow_dispatch:

defaults:
  run:
    working-directory: python

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} --all-extras pytest tests/test_unit.py -q

  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: foundry-rs/foundry-toolchain@v1
      - run: uv run --all-extras pytest tests/test_fork.py -s
