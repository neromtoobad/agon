name: python-release
# Publishes the Python package (agon-delphi) to PyPI when a GitHub release tagged python-vX.Y.Z is published.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: no token stored anywhere
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --all-extras pytest tests/test_unit.py -q
      - run: uv build
      - run: uv publish --trusted-publishing always
