[project]
name = "agon-delphi"
version = "0.3.2"
description = "Agon for Python: trade Delphi prediction markets from Python and AI agents with no API key, and keep a sealed, on-chain record of what your agent believed before each trade."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [{ name = "neromtoobad" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
keywords = ["agon", "delphi", "gensyn", "prediction-markets", "mcp", "agents", "web3"]
dependencies = [
    "httpx>=0.27",
    "web3>=7",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
agon = "agon.cli:main"
agon-mcp = "agon.mcp_server:main"

[project.urls]
Homepage = "https://agon.nerom.site"
Repository = "https://github.com/neromtoobad/agon"
Documentation = "https://github.com/neromtoobad/agon/tree/main/python"
Issues = "https://github.com/neromtoobad/agon/issues"

[tool.uv.build-backend]
module-name = "agon"
